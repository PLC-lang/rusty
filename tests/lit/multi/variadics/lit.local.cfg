# Build the C library that implements the variadic contracts and link the test against it
import os.path
import subprocess

# Access the same parameters that the main configuration uses
stdlibLocation = lit_config.params["LIB"]

source_path = os.path.abspath(os.path.dirname(__file__))

# Use tmp directory for compiled library
tmp_lib_path = "/tmp"
tmp_lib_file = f"{tmp_lib_path}/libvariadic_contracts.so"

# Compile variadic_contracts.c to libvariadic_contracts.so in the tmp directory
try:
    lit_config.note(f"Compiling variadic_contracts.c into {tmp_lib_file}...")
    gcc_cmd = f"gcc -shared -fPIC -o {tmp_lib_file} {source_path}/variadic_contracts.c"
    lit_config.note(f"Running: {gcc_cmd}")
    result = subprocess.run(gcc_cmd, shell=True, check=True,
                           stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    lit_config.note(f"Successfully compiled {tmp_lib_file}")
except subprocess.CalledProcessError as e:
    lit_config.error(f"Failed to compile variadic_contracts.c: {e.stderr.decode()}")
    raise

# C23 relaxes variadic parameter lists (no named parameter needed, single-argument `va_start`).
# The flag spelling depends on the compiler version, and older compilers support neither form, so
# probe for it and expose the C23 part of the suite only when it builds.
c23_flag = None
for flag in ("-std=c23", "-std=c2x"):
    probe = subprocess.run(
        f"gcc {flag} -fsyntax-only {source_path}/variadic_contracts_c23.c",
        shell=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    if probe.returncode == 0:
        c23_flag = flag
        break

tmp_lib_c23_file = f"{tmp_lib_path}/libvariadic_contracts_c23.so"
if c23_flag:
    try:
        lit_config.note(f"Compiling variadic_contracts_c23.c with {c23_flag}...")
        gcc_c23_cmd = (
            f"gcc {c23_flag} -shared -fPIC -o {tmp_lib_c23_file} "
            f"{source_path}/variadic_contracts_c23.c"
        )
        lit_config.note(f"Running: {gcc_c23_cmd}")
        subprocess.run(gcc_c23_cmd, shell=True, check=True,
                       stdout=subprocess.PIPE, stderr=subprocess.PIPE)
        config.available_features.add('c23-varargs')
    except subprocess.CalledProcessError as e:
        lit_config.error(f"Failed to compile variadic_contracts_c23.c: {e.stderr.decode()}")
        raise
else:
    lit_config.note("No C23 variadic support in gcc, skipping the C23 part of the suite")

# Extend the suite's compile command so the variadics tests keep every flag it carries, the
# optimization level of the current matrix cell included
inherited = dict(config.substitutions)
compile = f'{inherited["%COMPILE"]}'
compile = f'{compile} -L{tmp_lib_path} -lvariadic_contracts -i {source_path}/variadic_contracts.pli'

compile_c23 = f'{compile} -lvariadic_contracts_c23'
compile_c23 = f'{compile_c23} -i {source_path}/variadic_contracts_c23.pli'

# Log the compile command
lit_config.note(f"Compile command: {compile}")

# Run from the same output directory the compile command writes to, with the contract libraries
# on the library path
run_cmd = f'LD_LIBRARY_PATH="{stdlibLocation}/lib:{tmp_lib_path}" %T/%basename_t.out'

# Override the substitutions
config.substitutions = [s for s in config.substitutions if s[0] not in ['%COMPILE', '%RUN']]
config.substitutions.append(('%COMPILE_C23', f'{compile_c23}'))
config.substitutions.append(('%COMPILE', f'{compile}'))
config.substitutions.append(('%RUN', f'{run_cmd}'))
