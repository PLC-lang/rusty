import os.path
import subprocess
import tempfile

stdlibLocation = lit_config.params["LIB"]
compilerLocation = lit_config.params["COMPILER"]

test_dir = os.path.dirname(__file__)
source_path = os.path.abspath(test_dir)
rustyRootDirectory = os.path.abspath(os.path.join(test_dir, "..", "..", "..", ".."))

tmp_path = tempfile.mkdtemp(prefix="external_enum_variants_")
common_includes = (
    f" -i \"{stdlibLocation}/include/*.st\""
    f" -i \"{rustyRootDirectory}/tests/lit/util/*.pli\""
)

# Step 1: base.st owns the enum and the global
base_obj = os.path.join(tmp_path, "base.o")
base_cmd = f"{compilerLocation} -c --fpic -o {base_obj}{common_includes} {source_path}/base.st"

# Step 2: lib.st only includes base.st, so it must not define the enum variants again
lib_obj = os.path.join(tmp_path, "lib.o")
lib_cmd = (
    f"{compilerLocation} -c --fpic -o {lib_obj}{common_includes}"
    f" -i {source_path}/base.st {source_path}/lib.st"
)

for cmd in (base_cmd, lib_cmd):
    try:
        lit_config.note(f"Running: {cmd}")
        subprocess.run(cmd, shell=True, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    except subprocess.CalledProcessError as e:
        lit_config.error(f"Failed: {cmd}: {e.stderr.decode()}")
        raise

# Step 3: main.st includes both and links both objects
compile = f"{compilerLocation}"
compile = f"{compile} -o %t.out"
compile = f"{compile} -liec61131std -L{stdlibLocation}/lib{common_includes}"
compile = f"{compile} -i {source_path}/base.st -i {source_path}/lib.st"
compile = f"{compile} --linker=cc"
compile = f"{compile} {base_obj} {lib_obj}"

run_cmd = f'env LD_LIBRARY_PATH="{stdlibLocation}/lib" %t.out'

config.substitutions = [s for s in config.substitutions if s[0] not in ["%COMPILE", "%RUN"]]
config.substitutions.append(("%COMPILE", f"{compile}"))
config.substitutions.append(("%RUN", f"{run_cmd}"))
